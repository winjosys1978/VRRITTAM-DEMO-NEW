<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VRRITTAM - Parent Attendance</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ff;
}

header{
    background:#1565C0;
    color:white;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:22px;
}

.back-btn{
    background:white;
    color:#1565C0;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:800px;
    margin:auto;
    padding:25px 20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
    margin-bottom:20px;
}

.card h2{
    color:#003366;
    margin-bottom:12px;
}

.info p{
    margin:7px 0;
    color:#555;
}

.summary{
    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(150px,1fr));

    gap:15px;

    margin-top:20px;
}

.box{
    background:#f5f9ff;
    padding:20px;
    border-radius:10px;
    text-align:center;
}

.box h3{
    color:#003366;
    margin-bottom:8px;
}

.value{
    font-size:28px;
    font-weight:bold;
    color:#1565C0;
}

.today{
    margin-top:20px;
    padding:15px;

    background:#e8f5e9;
    color:#2e7d32;

    border-radius:8px;

    text-align:center;

    font-weight:bold;
}

.ai-box{
    margin-top:20px;
    padding:18px;

    background:#f5f9ff;

    border-left:5px solid #1565C0;

    border-radius:8px;
}

.ai-box h3{
    color:#1565C0;
    margin-bottom:8px;
}

.ai-box p{
    line-height:1.6;
    color:#444;
}

footer{
    text-align:center;
    padding:25px 10px;
    color:#666;
    font-size:13px;
}

@media(max-width:600px){

    header{
        flex-direction:column;
        align-items:stretch;
        gap:12px;
    }

    .back-btn{
        width:100%;
    }

    .card{
        padding:18px;
    }

}

</style>

</head>


<body>


<header>

<h1>
👨‍👩‍👦 Child Attendance
</h1>

<button
class="back-btn"
onclick="goBack()">

← Back to Parent Dashboard

</button>

</header>



<div class="container">


<div class="card info">

<h2>
👨‍🎓 Child Information
</h2>

<p>
<strong>Name:</strong>
<span id="studentName"></span>
</p>

<p>
<strong>Class:</strong>
<span id="studentClass"></span>
</p>

<p>
<strong>Academic Year:</strong>
<span id="academicYear"></span>
</p>


<div class="summary">


<div class="box">

<h3>
Present
</h3>

<div
class="value"
id="present">
0
</div>

</div>


<div class="box">

<h3>
Absent
</h3>

<div
class="value"
id="absent">
0
</div>

</div>


<div class="box">

<h3>
Late
</h3>

<div
class="value"
id="late">
0
</div>

</div>


<div class="box">

<h3>
Attendance
</h3>

<div class="value">

<span id="percentage">
0
</span>%

</div>

</div>


</div>


<div
class="today"
id="todayStatus">

Loading...

</div>


<div class="ai-box">

<h3>
🤖 AI Attendance Insight
</h3>

<p id="aiInsight">
Analysing attendance...
</p>

</div>


</div>


</div>



<footer>

<p>
VRRITTAM – Education Copilot
</p>

<p>
கற்க கசடற, வளர்க அதற்குத் தக.
</p>

</footer>



<script src="vrrittam-data.js"></script>


<script>


/* =====================================
   LOAD SHARED DATA
===================================== */

const data =
loadVRRITTAMData();



/* CHILD INFORMATION */

document.getElementById(
    "studentName"
).innerText =
data.student.name;


document.getElementById(
    "studentClass"
).innerText =
data.student.className;


document.getElementById(
    "academicYear"
).innerText =
data.student.academicYear;



/* ATTENDANCE */

document.getElementById(
    "present"
).innerText =
data.attendance.present;


document.getElementById(
    "absent"
).innerText =
data.attendance.absent;


document.getElementById(
    "late"
).innerText =
data.attendance.late;


document.getElementById(
    "percentage"
).innerText =
data.attendance.percentage;



/* TODAY STATUS */

const studentStatus =
data.studentAttendance &&
data.studentAttendance.Arun
    ? data.studentAttendance.Arun
    : "Present";


document.getElementById(
    "todayStatus"
).innerText =

"Today's Attendance: " +
studentStatus;



/* =====================================
   AI INSIGHT
===================================== */

let insight = "";


if(data.attendance.percentage >= 90){

    insight =
    data.student.name +
    " has excellent attendance at " +
    data.attendance.percentage +
    "%. Please encourage your child to maintain this regular attendance.";

}

else if(data.attendance.percentage >= 75){

    insight =
    data.student.name +
    " currently has " +
    data.attendance.percentage +
    "% attendance. Regular attendance will help maintain consistent academic progress.";

}

else{

    insight =
    data.student.name +
    " currently has only " +
    data.attendance.percentage +
    "% attendance. VRRITTAM recommends immediate attention to regular class attendance.";

}


document.getElementById(
    "aiInsight"
).innerText =
insight;



/* =====================================
   BACK
===================================== */

function goBack(){

    window.location.href =
    "parent-dashboard.html";

}

</script>


</body>

</html>
