<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Homework</title>


<style>

body{
font-family:Arial,sans-serif;
background:#eef5ff;
margin:0;
}

header{
background:#1565C0;
color:white;
padding:20px;
text-align:center;
}

.container{
padding:30px;
max-width:800px;
margin:auto;
}

.card{
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.15);
margin-bottom:20px;
}

h2{
color:#003366;
}

.homework-item{
border:1px solid #ddd;
border-radius:10px;
padding:18px;
margin-top:15px;
background:#f9fbff;
}

.homework-item h3{
color:#1565C0;
margin-top:0;
}

.homework-item p{
font-size:16px;
line-height:1.6;
}

.date{
font-weight:bold;
color:#d35400;
}

.empty{
text-align:center;
padding:20px;
color:#666;
}

button{
margin-top:20px;
padding:12px 20px;
background:#1565C0;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#0D47A1;
}

.ai-box{
margin-top:20px;
padding:18px;
background:#f5f9ff;
border-left:5px solid #1565C0;
border-radius:8px;
}

.ai-box h3{
color:#1565C0;
margin-top:0;
}

.ai-box p{
line-height:1.6;
}

</style>

</head>


<body>


<header>

<h1>
📝 Homework
</h1>

<p>
VRRITTAM Student Portal
</p>

</header>



<div class="container">


<div class="card">

<h2>
📚 Assigned Homework
</h2>


<div id="homeworkList">

</div>


<div class="ai-box">

<h3>
🤖 AI Homework Insight
</h3>

<p id="aiInsight">
Checking your homework...
</p>

</div>


<button
onclick="window.location.href='student-dashboard.html'">

⬅ Back to Dashboard

</button>


</div>

</div>



<!-- SHARED DATA -->

<script src="vrrittam-data.js"></script>


<script>


/* =====================================
   LOAD SHARED DATA
===================================== */

const data =
loadVRRITTAMData();



/* =====================================
   HOMEWORK LIST
===================================== */

const homeworkList =
document.getElementById(
    "homeworkList"
);


const homework =
data.homework || [];


if(homework.length === 0){

    homeworkList.innerHTML =

    '<div class="empty">' +

    'No homework has been assigned yet.' +

    '</div>';

}

else{


    /*
       Show latest homework first
    */

    const latestHomework =
        [...homework].reverse();


    latestHomework.forEach(
        function(item){

            const box =
                document.createElement(
                    "div"
                );


            box.className =
                "homework-item";


            box.innerHTML =

            "<h3>" +

            "📘 " +
            item.subject +

            "</h3>" +


            "<p>" +

            "<strong>" +
            item.title +
            "</strong>" +

            "</p>" +


            "<p>" +

            item.description +

            "</p>" +


            "<p class='date'>" +

            "📅 Submission Date: " +

            item.submissionDate +

            "</p>" +


            "<p>" +

            "🏫 Class: " +

            item.className +

            "</p>";


            homeworkList.appendChild(
                box
            );

        }
    );

}



/* =====================================
   AI HOMEWORK INSIGHT
===================================== */

const homeworkCount =
homework.length;


let insight = "";


if(homeworkCount === 0){

    insight =

    "No homework is currently assigned. " +
    "You can use this time for revision.";

}

else if(homeworkCount === 1){

    insight =

    "You have 1 assigned homework. " +
    "Complete it before the submission date.";

}

else{

    insight =

    "You currently have " +
    homeworkCount +
    " assigned homework tasks. " +
    "Plan your study time and complete them before their deadlines.";

}


document.getElementById(
    "aiInsight"
).innerText =
insight;


</script>


</body>

</html>
