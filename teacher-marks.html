<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VRRITTAM - Teacher Marks</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ff;
}

header{
    background:#1f2c8c;
    color:white;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

header h1{
    font-size:22px;
}

.back-btn{
    background:white;
    color:#1f2c8c;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:950px;
    margin:auto;
    padding:25px 20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,.12);
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
}

select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:20px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th,
td{
    border:1px solid #ccc;
    padding:12px;
    text-align:center;
}

th{
    background:#e3f2fd;
    color:#003366;
}

input{
    width:80px;
    padding:8px;
    border:1px solid #bbb;
    border-radius:6px;
    text-align:center;
    font-size:15px;
}

.save-btn{
    width:100%;
    margin-top:20px;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#1565C0;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:hover{
    background:#0D47A1;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    background:#e8f5e9;
    color:#2e7d32;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

@media(max-width:600px){

    header{
        flex-direction:column;
        align-items:stretch;
        gap:12px;
    }

    .back-btn{
        width:100%;
    }

    .card{
        padding:16px;
    }

    th,
    td{
        padding:8px 4px;
        font-size:13px;
    }

    input{
        width:60px;
    }

}

</style>

</head>


<body>


<header>

<h1>
📊 Enter Marks
</h1>

<button
class="back-btn"
onclick="goBack()">

← Back

</button>

</header>



<div class="container">


<div class="card">


<label>
Select Class
</label>

<select id="classSelect">

<option value="10-A">
Class 10 A
</option>

<option value="10-B">
Class 10 B
</option>

<option value="9-A">
Class 9-A
</option>

</select>



<label>
Select Subject
</label>

<select id="subjectSelect">

<option value="Mathematics">
Mathematics
</option>

<option value="Science">
Science
</option>

<option value="English">
English
</option>

<option value="Tamil">
Tamil
</option>

<option value="Social Science">
Social Science
</option>

</select>



<h2>
Student Marks
</h2>


<table>

<thead>

<tr>

<th>
Student
</th>

<th>
Mark / 100
</th>

</tr>

</thead>


<tbody>


<tr>

<td>
Arun Kumar
</td>

<td>

<input
type="number"
id="arunMark"
min="0"
max="100"
value="85">

</td>

</tr>



<tr>

<td>
Priya
</td>

<td>

<input
type="number"
id="priyaMark"
min="0"
max="100"
value="80">

</td>

</tr>



<tr>

<td>
Rahul
</td>

<td>

<input
type="number"
id="rahulMark"
min="0"
max="100"
value="75">

</td>

</tr>


</tbody>

</table>



<button
class="save-btn"
onclick="saveMarks()">

💾 Save Marks

</button>


<div
id="message"
class="message">

Marks saved successfully!

</div>


</div>

</div>



<script src="vrrittam-data.js"></script>


<script>


/* =====================================
   LOAD EXISTING DATA
===================================== */

const data =
loadVRRITTAMData();


/* =====================================
   LOAD CURRENT SUBJECT MARK
===================================== */

const subject =
document.getElementById(
    "subjectSelect"
);


function loadCurrentMarks(){

    const selectedSubject =
        subject.value;


    if(
        data.marks &&
        data.marks[selectedSubject] !== undefined
    ){

        document.getElementById(
            "arunMark"
        ).value =
        data.marks[selectedSubject];

    }

}


subject.addEventListener(
    "change",
    loadCurrentMarks
);


loadCurrentMarks();



/* =====================================
   SAVE MARKS
===================================== */

function saveMarks(){

    const selectedSubject =
        subject.value;


    const arun =
        Number(
            document.getElementById(
                "arunMark"
            ).value
        );


    const priya =
        Number(
            document.getElementById(
                "priyaMark"
            ).value
        );


    const rahul =
        Number(
            document.getElementById(
                "rahulMark"
            ).value
        );


    /* VALIDATION */

    if(
        arun < 0 ||
        arun > 100 ||
        priya < 0 ||
        priya > 100 ||
        rahul < 0 ||
        rahul > 100
    ){

        alert(
            "Please enter marks between 0 and 100."
        );

        return;

    }


    /* ARUN = DEMO STUDENT */

    data.marks[selectedSubject] =
        arun;


    /* STORE ALL STUDENTS */

    if(!data.studentMarks){

        data.studentMarks = {};

    }


    if(!data.studentMarks.Arunc){

        data.studentMarks.Arunc = {};

    }


    data.studentMarks.Arunc[
        selectedSubject
    ] = arun;


    if(!data.studentMarks.Priya){

        data.studentMarks.Priya = {};

    }


    data.studentMarks.Priya[
        selectedSubject
    ] = priya;


    if(!data.studentMarks.Rahul){

        data.studentMarks.Rahul = {};

    }


    data.studentMarks.Rahul[
        selectedSubject
    ] = rahul;


    /* SAVE TO LOCAL STORAGE */

    localStorage.setItem(

        "VRRITTAM_DATA",

        JSON.stringify(data)

    );


    /* SUCCESS MESSAGE */

    document.getElementById(
        "message"
    ).style.display =
    "block";


    setTimeout(function(){

        document.getElementById(
            "message"
        ).style.display =
        "none";

    },2000);

}



/* =====================================
   BACK
===================================== */

function goBack(){

    window.location.href =
    "teacher-dashboard.html";

}

</script>


</body>

</html>
