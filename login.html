<script>

/* =========================================
   VRRITTAM LOGIN CONFIGURATION
========================================= */

const loginUsers = {

    student: {

        username:"student",

        password:"123",

        roleName:"Student",

        dashboard:
        "student-dashboard.html"

    },


    aicopilot: {

        username:"aicopilot",

        password:"123",

        roleName:"AI Copilot",

        dashboard:
        "ai-copilot.html"

    },


    parent: {

        username:"parent",

        password:"123",

        roleName:"Parent",

        dashboard:
        "parent-dashboard.html"

    },


    teacher: {

        username:"teacher",

        password:"123",

        roleName:"Teacher",

        dashboard:
        "teacher-dashboard.html"

    },

schooladmin: {
    username:"schooladmin",
    password:"123",
    roleName:"School Admin",
    dashboard:"VRRITTAM-Smart-School-Dashboard.html"
},


   superadmin: {

    username:"winjosys@gmail.com",

    password:"",

    roleName:"Super Admin",

    dashboard:
    "super-admin-dashboard-v2.html"

    }
};

/* =========================================
   QUICK LOGIN
========================================= */

function quickLogin(role){

    const account =
        loginUsers[role];

    if(!account){

        return;
    }


    document.getElementById(
        "userRole"
    ).value = role;


    document.getElementById(
        "username"
    ).value =
        account.username;


    document.getElementById(
        "password"
    ).value =
        account.password;


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.style.color =
        "#1565C0";


    message.textContent =
        account.roleName +
        " selected. Click Login.";

}


/* =========================================
   LOGIN
========================================= */

async function loginUser(){

    const role =
        document.getElementById("userRole").value;

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if(username === "" || password === ""){

        message.style.color = "#dc2626";

        message.textContent =
            currentLanguage === "ta"
            ? "பயனர்பெயர் மற்றும் கடவுச்சொல்லை உள்ளிடவும்."
            : "Please enter username and password.";

        return;
    }

    try{

        const userCredential =
            await firebase.auth().signInWithEmailAndPassword(
                username,
                password
            );

        const user =
            userCredential.user;

        console.log(
            "VRRITTAM Firebase Login Success:",
            user.email
        );

        sessionStorage.setItem(
            "vrrittamLoggedIn",
            "true"
        );

        sessionStorage.setItem(
            "vrrittamRole",
            role
        );

        sessionStorage.setItem(
            "vrrittamUsername",
            user.email
        );

        message.style.color = "#15803d";

        message.textContent =
            currentLanguage === "ta"
            ? "உள்நுழைவு வெற்றிகரமாக முடிந்தது."
            : "Login successful.";

        const account = loginUsers[role];

        if(!account){

            console.error(
                "VRRITTAM Role configuration missing:",
                role
            );

            message.style.color = "#dc2626";

            message.textContent =
                "Role configuration not found.";

            return;
        }

        sessionStorage.setItem(
            "vrrittamRoleName",
            account.roleName
        );

        setTimeout(function(){

            window.location.href =
                account.dashboard;

        }, 400);

    }
    catch(error){

        console.error(
            "VRRITTAM Firebase Login Error:",
            error
        );

        message.style.color = "#dc2626";

        if(error.code === "auth/invalid-credential"){

            message.textContent =
                currentLanguage === "ta"
                ? "தவறான Email அல்லது Password."
                : "Invalid email or password.";

        }
        else if(error.code === "auth/user-not-found"){

            message.textContent =
                currentLanguage === "ta"
                ? "இந்த Email-க்கு பயனர் கிடைக்கவில்லை."
                : "User not found.";

        }
        else if(error.code === "auth/wrong-password"){

            message.textContent =
                currentLanguage === "ta"
                ? "தவறான Password."
                : "Incorrect password.";

        }
        else{

            message.textContent =
                currentLanguage === "ta"
                ? "Login தோல்வியடைந்தது. Console-ஐ பார்க்கவும்."
                : "Login failed. Check the Console.";

        }
    }
}

/* =========================================
   SHOW PASSWORD
========================================= */

document
.getElementById("showPassword")
.addEventListener(
    "change",
    function(){

        const password =
            document.getElementById(
                "password"
            );


        password.type =
            this.checked
            ? "text"
            : "password";

    }
);


/* =========================================
   FORGOT PASSWORD
========================================= */

function forgotPassword(event){

    event.preventDefault();


    const role =
        document.getElementById(
            "userRole"
        ).value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    const account =
        loginUsers[role];


    message.style.color =
        "#1565C0";


    message.textContent =
        currentLanguage === "ta"
        ? account.roleName +
          " க்கான கடவுச்சொல் மீட்பு வசதி விரைவில் வரும்."
        : "Password reset assistance for " +
          account.roleName +
          " will be available soon.";

}


/* =========================================
   LANGUAGE
========================================= */

let currentLanguage = "en";


const translations = {

    en: {

        back:
        "← Back to Home",

        login:
        "Secure Login",

        role:
        "Select Login Role",

        language:
        "Select Language",

        username:
        "Username",

    ta: {

        login:
        "பாதுகாப்பான உள்நுழைவு",

        role:
        "உள்நுழைவு வகையைத் தேர்ந்தெடுக்கவும்",

        language:
        "மொழியைத் தேர்ந்தெடுக்கவும்",

        username:
        "பயனர்பெயர்",

        password:
        "கடவுச்சொல்",

        show:
        "கடவுச்சொல்லைக் காண்பி",

        forgot:
        "கடவுச்சொல் மறந்துவிட்டதா?",

        quick:
        "விரைவு உள்நுழைவு",

        loginButton:
        "உள்நுழைவு",

        description:
        "மாணவர்கள், ஆசிரியர்கள், பெற்றோர், பள்ளிகள் மற்றும் கல்வி நிறுவனங்களுக்கான AI சார்ந்த Education Copilot.",

        selected:
        " தேர்ந்தெடுக்கப்பட்டது. உள்நுழைவை அழுத்தவும்.",

        selectedLanguage:
        "தமிழ் மொழி தேர்ந்தெடுக்கப்பட்டது."

    }

};


function changeLanguage(){

    const language =
        document.getElementById(
            "language"
        ).value;


    currentLanguage =
        language;


    const t =
        translations[language];


    document.getElementById(
        "backHome"
    ).textContent =
        t.back;


    document.getElementById(
        "loginTitle"
    ).textContent =
        t.login;


    document.getElementById(
        "roleLabel"
    ).textContent =
        t.role;


    document.getElementById(
        "languageLabel"
    ).textContent =
        t.language;


    document.getElementById(
        "username"
    ).placeholder =
        t.username;


    document.getElementById(
        "password"
    ).placeholder =
        t.password;


    document.getElementById(
        "showPasswordText"
    ).textContent =
        t.show;


    document.getElementById(
        "forgotLink"
    ).textContent =
        t.forgot;


    document.getElementById(
        "quickTitle"
    ).textContent =
        t.quick;


    document.getElementById(
        "loginButton"
    ).textContent =
        t.loginButton;


    document.getElementById(
        "brandDescription"
    ).textContent =
        t.description;


    const message =
        document.getElementById(
            "loginMessage"
        );


    message.style.color =
        "#1565C0";


    message.textContent =
        t.selectedLanguage;

}


document
.getElementById("language")
.addEventListener(
    "change",
    changeLanguage
);


/* =========================================
   ENTER KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loginUser();

);
