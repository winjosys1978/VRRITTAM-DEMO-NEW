<!DOCTYPE html>
<html>

<head>

<title>Teacher Dashboard - VRRITTAM</title>


<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fb;
}


.header{

    background:#1a237e;
    color:white;
    padding:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

}


.logo{

    font-size:24px;
    font-weight:bold;

}


.logout{

    background:white;
    color:#1a237e;
    border:none;

    padding:10px 20px;
    border-radius:20px;

    cursor:pointer;

}



.container{

    padding:20px;

}



.welcome{

    background:white;
    padding:20px;

    border-radius:15px;

    box-shadow:0 2px 8px #ccc;

}




.cards{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));

    gap:20px;

    margin-top:20px;

}




.card{

    background:white;

    padding:25px;

    border-radius:15px;

    text-align:center;

    box-shadow:0 2px 8px #ccc;

    cursor:pointer;

}



.card:hover{

    transform:scale(1.03);

}



.icon{

    font-size:40px;

}



.card button{

    background:#3949ab;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:25px;

    cursor:pointer;

}



</style>


</head>


<body>



<div class="header">


<div class="logo">

VRRITTAM 👨‍🏫

</div>



<button class="logout" onclick="logout()">

Logout

</button>


</div>





<div class="container">



<div class="welcome">


<h2>
Welcome Teacher
</h2>


<p>
School: VRRITTAM Demo School
</p>


<p>
Teacher Name: Winjosys Teacher
</p>


</div>





<div class="cards">



<div class="card" onclick="openAttendance()">

<div class="icon">
📋
</div>

<h3>
Attendance
</h3>

<p>
Mark Student Attendance
</p>

</div>





<div class="card" onclick="openHomework()">

<div class="icon">
📚
</div>

<h3>
Homework
</h3>

<p>
Create & Publish Homework
</p>

</div>






<div class="card" onclick="openMarks()">

<div class="icon">
📝
</div>

<h3>
Marks
</h3>

<p>
Enter Exam Marks
</p>

</div>






<div class="card" onclick="openCourses()">

<div class="icon">
📖
</div>

<h3>
Courses
</h3>

<p>
View Subjects & Courses
</p>

</div>






<div class="card" onclick="openAI()">

<div class="icon">
🤖
</div>

<h3>
AI Copilot
</h3>

<p>
Teacher Assistant
</p>

</div>




</div>


</div>







<script>


function openAttendance(){

window.location.href="teacher-attendance.html";

}



function openHomework(){

window.location.href="teacher-homework.html";

}



function openMarks(){

window.location.href="teacher-marks.html";

}


function openCourses(){

    window.location.href="courses.html?role=teacher";

}


function openAI(){

window.location.href="teacher-ai-copilot.html";

}


function logout(){

window.location.href="login.html";

}

</script>


</body>

</html>
