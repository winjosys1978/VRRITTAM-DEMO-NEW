<!DOCTYPE html>
<html lang="ta">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>VRRITTAM - Parent Homework</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ff;
    color:#222;
}

header{
    background:#1565C0;
    color:white;
    padding:18px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    flex-wrap:wrap;
}

.header-left h1{
    font-size:23px;
    margin-bottom:5px;
}

.header-left p{
    font-size:14px;
}

.back-btn{
    background:white;
    color:#1565C0;

    border:none;

    padding:10px 16px;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;
}

.back-btn:hover{
    background:#e3f2fd;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px 20px;
}

.child-card{
    background:white;

    padding:20px;

    border-radius:12px;

    box-shadow:
    0 4px 10px rgba(0,0,0,.10);

    margin-bottom:20px;
}

.child-card h2{
    color:#003366;
    margin-bottom:10px;
}

.child-card p{
    margin:6px 0;
    color:#555;
}

.homework-card{
    background:white;

    padding:20px;

    border-radius:12px;

    box-shadow:
    0 4px 10px rgba(0,0,0,.10);

    margin-bottom:15px;
}

.homework-card h2{
    color:#003366;
    margin-bottom:15px;
}

.subject{
    color:#1565C0;
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.homework-title{
    font-size:17px;
    font-weight:bold;
    margin-bottom:8px;
}

.homework-description{
    color:#666;
    margin-bottom:12px;
    line-height:1.5;
}

.homework-date{
    font-size:14px;
    color:#555;
    margin-bottom:10px;
}

.status{
    display:inline-block;

    padding:6px 12px;

    border-radius:20px;

    font-size:13px;

    font-weight:bold;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.ai-box{
    background:white;

    margin-top:20px;

    padding:20px;

    border-radius:12px;

    border-left:5px solid #1565C0;

    box-shadow:
    0 4px 10px rgba(0,0,0,.10);
}

.ai-box h3{
    color:#1565C0;
    margin-bottom:8px;
}

.ai-box p{
    line-height:1.5;
    color:#555;
}

.empty{
    text-align:center;
    color:#666;
    padding:20px;
}

footer{
    text-align:center;

    padding:25px 10px;

    color:#666;

    font-size:13px;
}

@media(max-width:600px){

    header{
        padding:15px;
    }

    .header-left h1{
        font-size:19px;
    }

    .back-btn{
        width:100%;
        margin-top:12px;
    }

    .container{
        padding:18px 12px;
    }

    .homework-card{
        padding:16px;
    }

}

</style>

</head>


<body>


<header>

<div class="header-left">

<h1>
📝 Parent Homework
</h1>

<p>
VRRITTAM Parent Portal
</p>

</div>


<button
class="back-btn"
type="button"
onclick="backToDashboard()">

← Back to Parent Dashboard

</button>

</header>



<div class="container">


<!-- CHILD INFORMATION -->

<div class="child-card">

<h2>
👨‍🎓 Child Information
</h2>

<p>
<strong>Name:</strong>
<span id="studentName"></span>
</p>

<p>
<strong>Class:</strong>
<span id="studentClass"></span>
</p>

<p>
<strong>Academic Year:</strong>
<span id="academicYear"></span>
</p>

</div>



<!-- HOMEWORK -->

<div
id="homeworkList">

</div>



<!-- AI INSIGHT -->

<div class="ai-box">

<h3>
🤖 AI Homework Insight
</h3>

<p id="aiInsight">
Checking homework...
</p>

</div>


</div>



<footer>

<p>
VRRITTAM – Education Copilot
</p>

<p>
கற்க கசடற, வளர்க அதற்குத் தக.
</p>

</footer>



<!-- SHARED DATA -->

<script src="vrrittam-data.js"></script>


<script>


/* =====================================
   LOAD SHARED DATA
===================================== */

const data =
loadVRRITTAMData();



/* =====================================
   CHILD INFORMATION
===================================== */

document.getElementById(
    "studentName"
).innerText =
data.student.name;


document.getElementById(
    "studentClass"
).innerText =
data.student.className;


document.getElementById(
    "academicYear"
).innerText =
data.student.academicYear;



/* =====================================
   LOAD HOMEWORK
===================================== */

const homeworkList =
document.getElementById(
    "homeworkList"
);


const homework =
data.homework || [];


if(homework.length === 0){

    homeworkList.innerHTML =

    '<div class="homework-card empty">' +

    '📚 No homework has been assigned yet.' +

    '</div>';

}


else{

    /*
       Latest homework first
    */

    const latestHomework =
        [...homework].reverse();


    latestHomework.forEach(
        function(item){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "homework-card";


            card.innerHTML =

            "<div class='subject'>" +

            "📘 " +
            item.subject +

            "</div>" +


            "<div class='homework-title'>" +

            item.title +

            "</div>" +


            "<div class='homework-description'>" +

            item.description +

            "</div>" +


            "<div class='homework-date'>" +

            "📅 Submission Date: " +

            item.submissionDate +

            "</div>" +


            "<div class='homework-date'>" +

            "🏫 Class: " +

            item.className +

            "</div>" +


            "<span class='status pending'>" +

            "Pending" +

            "</span>";


            homeworkList.appendChild(
                card
            );

        }
    );

}



/* =====================================
   AI INSIGHT
===================================== */

const homeworkCount =
    homework.length;


let insight = "";


if(homeworkCount === 0){

    insight =

    "There is currently no homework assigned to Arun Kumar.";

}

else if(homeworkCount === 1){

    insight =

    "Arun Kumar currently has 1 pending homework. " +
    "Please encourage your child to complete it before the submission date.";

}

else{

    insight =

    "Arun Kumar currently has " +
    homeworkCount +
    " assigned homework tasks. " +
    "Please encourage your child to complete them before the respective submission dates.";

}


document.getElementById(
    "aiInsight"
).innerText =
insight;



/* =====================================
   BACK TO PARENT DASHBOARD
===================================== */

function backToDashboard(){

    window.location.href =
        "parent-dashboard.html";

}

</script>


</body>

</html>
